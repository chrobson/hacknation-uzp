# Klasa dokumentu: odwołanie do Krajowej Izby Odwoławczej.
name: odwolanie

classify:
  # Suma wag pasujących sygnałów musi osiągnąć próg; wygrywa klasa z najwyższą sumą.
  threshold: 6
  signals:
    - {pattern: '^\s*O\s*D\s*W\s*O\s*Ł\s*A\s*N\s*I\s*E\b', weight: 3}
    - {pattern: 'wnosz[eę]\s+(niniejsze\s+)?odwołani', weight: 3}
    - {pattern: 'Krajow\w+\s+Izb\w+\s+Odwoławcz\w+', weight: 2, head_chars: 1500}
    - {pattern: '^\s*Odwołując\w*\s*:', weight: 2}
    - {pattern: '^\s*Zamawiając\w*\s*:', weight: 1}
    - {pattern: 'zarzut', weight: 1}

output_template:
  OdwolanieKIO:
    data: null
    czynnosc_dzien: null
    czynnosc_powod_id: null
    czynnosc_opis: null
    miejscowosc: null
  Odwolujacy:
    - krs: null
      nazwa: null
      nip: null
      regon: null
      przez-pelnomocnika: null
      pelnomocnik:
        imie_nazwisko: null
        nazwa: null
        mail: null
  Zamawiajacy:
    - krs: null
      nazwa: null
      nip: null
      regon: null
      prowadzacy_postepowanie: null
  ZamowieniePubliczne:
    numer_bzp: null
    numer_postepowania: null
    numer_ted: null
    tytul: null
