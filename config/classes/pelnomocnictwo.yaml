# Klasa dokumentu: pełnomocnictwo (procesowe) do reprezentacji przed KIO.
name: pelnomocnictwo

classify:
  threshold: 4
  required:
    - {pattern: 'P\s*E\s*Ł\s*N\s*O\s*M\s*O\s*C\s*N\s*I\s*C\s*T\s*W', head_chars: 800}
    - 'udziel\w*\s+(\w+\s+)?pełnomocnictw|ustanawia\w*\s+(\w+\s+)?pełnomocnik|upoważniam'
  signals:
    - {pattern: 'P\s*E\s*Ł\s*N\s*O\s*M\s*O\s*C\s*N\s*I\s*C\s*T\s*W', weight: 3, head_chars: 600}
    - {pattern: 'ustanawia\w*\s+(\w+\s+)?pełnomocnik|udziela\w*\s+(\w+\s+)*?pełnomocnictw|umocowan', weight: 2}
    - {pattern: 'mocodaw', weight: 2}
    - {pattern: 'pełnomocnik', weight: 1}
    - {pattern: 'Pełnomocnictwo\s+przyjmuję|przyjmuję\s+pełnomocnictwo', weight: 1}
    # Odwołanie też wspomina pełnomocnictwo ("w oparciu o załączone pełnomocnictwo"):
    - {pattern: 'wnosz[eę]\s+(niniejsze\s+)?odwołani', weight: -4}
    # Pisma procesowe, które nie są pełnomocnictwem:
    - {pattern: 'zgłasza\w*\s+przystąpienie|zgłoszenie\s+przystąpienia', weight: -6}
    - {pattern: 'odpowied\w*\s+na\s+odwołanie', weight: -6}
    - {pattern: 'wnosz\w*\s+o\s+oddalenie\s+odwołania', weight: -6}
    - {pattern: '^\s*(?-i:WYROK|POSTANOWIENIE)\b', weight: -6, head_chars: 1500}
    - {pattern: 'Sygn\.\s*akt', weight: -2, head_chars: 400}

output_template:
  mocodawca:
    - data:
        imie_nazwisko: null
        krs: null
        nazwa: null
        nip: null
        typ: null
      podpisujacy:
        - imie_nazwisko: null
  pelnomocnicy:
    - imie_nazwisko: null
      pesel: null

sections:
  # Część dokumentu opisująca mocodawcę (przed ustanowieniem pełnomocników).
  mocodawcy:
    start: '\A'
    end: ['udziela\w*\s+(niniejszym\s+)?pełnomocnictw', 'ustanawia\w*', 'upoważniam\w*', 'udzielają', '^\s*Pełnomocni(cy|k)\b', '§\s*2\b', 'reprezentowan\w*\s+przez\s+osoby']

fields:
  # Pełnomocnicy: imię i nazwisko po tytule zawodowym (adw., r. pr., ...), bez powtórzeń.
  pelnomocnicy:
    type: names
    pattern: '(?:\badw\.|\br\.\s*pr\.|\bradc\w*\s+prawn\w*|\badwokat\w*|\bapl\.\s*adw\.|\brzecznik\w*\s+patentow\w*)\s*([A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż]+\s+[A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż]+(?:-[A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż]+)?)'
    extra: {pesel: null}
    attrs: {pesel: 'PESEL\W{0,3}(\d{11})'}

lists:
  mocodawca:
    section: mocodawcy
    split: '(?:^|[\s:;])\d\)\s+(?=[A-ZŁŚŻŹĆŃÓ])'   # konsorcjum: "1) Firma A ...; 2) Firma B ..."
    fields:
      data.nazwa:
        - {type: pattern, pattern: 'pod\s+firmą\s+([\s\S]+?),\s*(?:ul\.|al\.|pl\.|os\.)', clean: true}
        # Pierwsza nazwa firmy: wyrazy z wielkiej litery (dopuszczalne łączniki i/w/z) + forma prawna.
        - type: pattern
          clean: true
          pattern: '(?-i:(?<![\w])((?:(?!Mocodaw|Działając|Pełnomoc|Dane\b|Zamawiaj|Wykonawc|Konsorcj|Ja\b)[A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż][\w\-.&]*|[A-ZŁŚŻŹĆŃÓ0-9][\w]*-[\w\-]+|„[^”]+”)(?:[ \t\n]+(?:(?!Mocodaw|Działając|Pełnomoc|Dane\b|Zamawiaj|Wykonawc|Konsorcj|Ja\b)[A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż][\w\-.&]*|[A-ZŁŚŻŹĆŃÓ0-9][\w]*-[\w\-]+|i|w|z|oraz|im\.|„[^”]+”))*?[ \t\n]+(?:S\.A\.|sp\.\s*z\s*o\.\s*o\.(?:\s*sp\.\s*k\.)?|sp\.\s*k\.|sp\.\s*j\.|sp\.\s*p\.|s\.c\.|Sp\.\s*z\s*o\.\s*o\.|Spółka\s+[\w ]+?(?=,|\n|\s\())))'
        - {type: pattern, pattern: 'Mocodawc\w*[ \t]+(?:jest[ \t]+)?(?!ustanaw|upoważ|udziel)([A-ZŁŚŻŹĆŃÓ0-9„"][^\n,(]+?)(?=,|\n|\s+\()', clean: true, reject: ['^(?-i:[A-ZŁŚŻŹĆŃÓ \t]+)$', 'pełnomoc']}
      data.krs: {type: pattern, pattern: 'KRS\W{0,3}(\d{10})', digits: true}
      data.nip: {type: pattern, pattern: 'NIP\W{0,3}(\d{3}[-\s]?\d{3}[-\s]?\d{2}[-\s]?\d{2}|\d{10})', digits: true}
      data.typ: {type: exists, scope: section, pattern: ['działalnoś\w*\s+gospodarcz', 'CEIDG', 'Ewidencji\s+i\s+Informacji'], if_true: osoba_fizyczna, if_false: osoba_prawna}
      data.imie_nazwisko:
        - {type: pattern, scope: section, pattern: 'niżej\s+podpisan\w*(?:\s*\(a\))?\s+([A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż]+\s+[A-ZŁŚŻŹĆŃÓ][a-ząćęłńóśźż-]+)'}
      # Podpisujący: nazwiska w bloku podpisów (po pierwszej linii kropek), bez pełnomocników i nazw funkcji.
      podpisujacy:
        type: names
        scope: document
        after: '\.{8,}'
        segment_by: '^\s*(?:W\s+imieniu|Za)\s[^\n]*:\s*$'
        exclude_from: pelnomocnicy
        stopwords: [Za, W, Imieniu, Prezes, Wiceprezes, Członek, Zarządu, Prokurent, Dyrektor, Właściciel, Wspólnik, Pełnomocnik, Pełnomocnictwo, Mocodawca, Mocodawcy, Zarząd, Generalny, Finansowy, Komplementariusz, Partner, Kierownik, Imię, Nazwisko, Podpis, Data, Miejsce, Strona, Sp, Spółka, Prezesa, Członka, Upoważniony, Upoważniona, Główny, Księgowy, Handlowy]
