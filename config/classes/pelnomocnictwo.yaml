# Klasa dokumentu: pełnomocnictwo (procesowe) do reprezentacji przed KIO.
name: pelnomocnictwo
description: pełnomocnictwo procesowe udzielone pełnomocnikowi przez mocodawcę

classify:
  threshold: 4
  required:
    - {pattern: '^\s*(?:UPOWAŻNIENIE|POWER\s+OF\s+ATTORNEY)\b', head_chars: 1500}
    - 'umocowuj\w*|power\s+of\s+attorney|attorney[- ]in[- ]fact|hereby\s+(?:appoint|authori[sz]e|grant)'
    - {pattern: 'pełnomocnictw|pełnomocnik', head_chars: 600}
    - {pattern: 'upoważni\w*|udziel\w*\s+(?:\w+\s+){0,3}pełnomocn|ustanaw\w*\s+(?:\w+\s+){0,3}pełnomocn', head_chars: 1500}
    - {pattern: 'P\s*E\s*Ł\s*N\s*O\s*M\s*O\s*C\s*N\s*I\s*C\s*T\s*W', head_chars: 800}
    - 'udziel\w*\s+(\w+\s+)?pełnomocnictw|ustanawia\w*\s+(\w+\s+)?pełnomocnik|upoważniam'
  fuzzy: {head: [pełnomocnictwo, pełnomocnictwa], min_hits: 4, words: [pełnomocnictwo, pełnomocnik, pełnomocnikiem, mocodawca, mocodawcy, udzielam, umocowanie, reprezentowania, substytucyjnych, pełnomocnictwa]}
  signals:
    # Pełnomocnictwo po angielsku
    - {pattern: 'power\s+of\s+attorney|attorney[- ]in[- ]fact', weight: 3, head_chars: 800}
    - {pattern: 'hereby\s+(?:appoint|authori[sz]e|grant|empower)', weight: 2}
    - {pattern: '\bto\s+represent\b', weight: 1}
    - {pattern: 'National\s+Appeal\s+Chamber|\bKIO\b', weight: 1}
    - {pattern: '\b(?:principal|grantor)\b', weight: 1}
    # „udzielają radcy prawnemu X, PESEL …, oraz … pełnomocnictwa” (dopełnienie między czasownikiem a rzeczownikiem)
    - {pattern: 'udziel\w*[\s\S]{0,200}?pełnomocnictw', weight: 2}
    # Dokumenty innego rodzaju (umowa, aneks, oferta, protokół), które tylko zawierają treść klasy:
    - {pattern: '^\s*(?-i:UMOWA|ANEKS|OFERTA|FORMULARZ\s+OFERTOWY|PROTOKÓŁ|REGULAMIN)\b', weight: -6, head_chars: 400}
    # Jednoznaczny nagłówek INNEJ klasy na górze dokumentu:
    - {pattern: '^\s*(?-i:O\s*D\s*W\s*O\s*Ł\s*A\s*N\s*I\s*E)\s*$', weight: -6, head_chars: 2500}
    - {pattern: '^\s*(?:potwierdzeni\w*\s+(?:realizacji\s+|wykonania\s+)?(?:polecenia\s+)?przelewu|polecenie\s+przelewu|dowód\s+wykonania\s+przelewu)', weight: -6, head_chars: 600}
    # Pisma KIO i zamawiającego innych rodzajów (nagłówek):
    - {pattern: '^\s*(?-i:WEZWANIE|ZAWIADOMIENIE|INFORMACJA\s+O\s+WYNIKU)\b', weight: -6, head_chars: 1500}
    - {pattern: '^\s*P\s*E\s*Ł\s*N\s*O\s*M\s*O\s*C\s*N\s*I\s*C\s*T\s*W', weight: 3, head_chars: 600}   # tytuł w linii, nie w tytule przelewu
    # Pełnomocnictwo do złożenia oferty / udziału w przetargu to inny dokument (0/100 prawdziwych ma „ofert”)
    - {pattern: '\bofert\w*', weight: -3}
    - {pattern: 'ustanawia\w*\s+(\w+\s+)?pełnomocnik|udziela\w*\s+(\w+\s+)*?pełnomocnictw|umocowan', weight: 2}
    - {pattern: 'mocodaw', weight: 2}
    - {pattern: '(?:upoważnia|ustanawia|udziela)\w*\s+(?:[\w„”.-]+\s+){0,5}?do\s+reprezentowania', weight: 2}
    - {pattern: 'pełnomocnik', weight: 1}
    - {pattern: 'Pełnomocnictwo\s+przyjmuję|przyjmuję\s+pełnomocnictwo', weight: 1}
    # Odwołanie też wspomina pełnomocnictwo ("w oparciu o załączone pełnomocnictwo"):
    - {pattern: 'wnosz[eę]\s+(niniejsze\s+)?odwołani', weight: -4}
    # Pisma procesowe, które nie są pełnomocnictwem:
    - {pattern: 'zgłasza\w*\s+przystąpienie|zgłoszenie\s+przystąpienia', weight: -6}
    - {pattern: 'odpowied\w*\s+na\s+odwołanie', weight: -6}
    - {pattern: 'wnosz\w*\s+o\s+oddalenie\s+odwołania', weight: -6}
    - {pattern: '^\s*(?-i:WYROK|POSTANOWIENIE)\b', weight: -6, head_chars: 1500}
    - {pattern: 'Sygn\.\s*akt', weight: -2, head_chars: 400}

output_template:
  mocodawca:
    - data:
        imie_nazwisko: null
        krs: null
        nazwa: null
        nip: null
        typ: null
      podpisujacy:
        - imie_nazwisko: null
  pelnomocnicy:
    - imie_nazwisko: null
      pesel: null

sections:
  # Część dokumentu opisująca mocodawcę (przed ustanowieniem pełnomocników).
  mocodawcy:
    start: '\A'
    end: ['udziela\w*\s+(niniejszym\s+)?pełnomocnictw', 'ustanawia\w*', 'upoważniam\w*', 'udzielają', '\budzielam(?:y)?\b', 'postanawia\w*\s+udziel', '^\s*Pełnomocni(cy|k)\b', '§\s*2\b', 'reprezentowan\w*\s+przez\s+osoby']

  # Formularz/tabela: nagłówek "PEŁNOMOCNIK", "PEŁNOMOCNICY" albo "2. Pełnomocnik" w osobnej linii.
  pelnomocnicy_formularz:
    start: '^[ \t]*(?:\d\.[ \t]*|[IVX]+\.[ \t]*)?Pełnomocni(?:cy|k)[ \t]*$'
    end: ['^[ \t]*(?:\d\.[ \t]*)?Zakres\b', '^[ \t]*Postępowanie\b', 'do\s+reprezentowania']

  # Lista pełnomocników po „udziela pełnomocnictwa:” aż do „do reprezentowania” (bez tytułów zawodowych, np. skany).
  pelnomocnicy_lista:
    isolated: true
    start: ['udziela\w*\s+(?:niniejszym\s+)?pełnomocnictw\w*\s*:', '(?-i:\b(?:upoważniam|udzielam|ustanawiam)(?:y)?\b[^:\nA-ZĄĆĘŁŃÓŚŹŻ]{0,80}:)']
    end: ['do\s+reprezentowania', '\bw\s+zakresie\b', 'do\s+działania', 'do\s+jednoosobowego', 'do\s+samodzielnego', 'pełnomocnictwa\s+do\b']

fields:
  # Pełnomocnicy. Najpierw formularz/tabela pod nagłówkiem "PEŁNOMOCNIK(CY)" ("Imię i nazwisko X"),
  # potem cały dokument: nazwisko po tytule zawodowym, wiersz tabeli "1 X Y adwokat", punktor "• X Y – r. pr.".
  pelnomocnicy:
    - type: names
      field: imie_nazwisko      # klucz wyjściowy imienia i nazwiska (jawnie, bez domyślnej nazwy w kodzie)
      nominative: true   # GT ma imiona i nazwiska w mianowniku
      titlecase: true
      section: pelnomocnicy_formularz
      pattern:
        - 'Imię\s+i\s+nazwisko[ \t:]+([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)'
        - '(?:\badw\.|\br\.\s*pr\.|\bradc\w*\s+prawn\w*|\badwokat\w*|\bapl\.\s*adw\.|\brzecznik\w*\s+patentow\w*)\s*([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)'
      reject_context: &rep_ctx ['(?:Prezes|Wiceprezes|Członek|Prokurent|Dyrektor|President|Director|Board|Management)\w*\s+(?:Zarządu|of|the)?', '\bwspólnik\w*\b']
      stopwords: &rep_stop [Pan, Pani, Panią, Pana, Panu, Krajowa, Krajową, Krajowej, Izba, Izbą, Izby, Zarząd, Zarządu, Spółki, Spółka, Spółkę, Członek, Prezes, Wiceprezes, Prokurent, Mocodawca, Mocodawcy, Odwołujący, Zamawiający, Wykonawca, Sąd, Sądem, Kancelaria, Kancelarii, Adwokatów, Adwokacka, Radców, Prawnych, Radcy, Prawnego, Dzienniku, Urzędowym, Biuletynie, Zamówień, Publicznych, Adwokat, Radca, Prawny, Pani, Panu, Panią]
      extra: {pesel: null}
      attrs: &rep_attrs {pesel: '\A(?:(?!\boraz\b|\bi\b|[;•]|\n[ \t]*(?:[–•\-]|\d+[ \t]))[\s\S])*?(?:PESEL\W{0,3}|[ \t—–-])(\d{11})(?!\d)'}
    - type: names
      nominative: true
      titlecase: true
      section: pelnomocnicy_lista
      field: imie_nazwisko
      pattern:
        - '(?<![\w-])(?<!ul\.[ \t])(?<!al\.[ \t])(?<!im\.[ \t])(?<!pl\.[ \t])([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]*\n?[ \t]*[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)(?![\wąćęłńóśźż])(?![ \t]+(?:sp\.|S\.A\.|spółk|Sp\.))'
        # imię i nazwisko WIELKIMI literami w osobnej linii („DARIUSZ ZIEMBIŃSKI”)
        - '^[ \t]*(?:\d{1,2}[.)][ \t]*)?([A-ZĄĆĘŁŃÓŚŹŻ]{2,}[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ]{2,}(?:-[A-ZĄĆĘŁŃÓŚŹŻ]{2,})?)[ \t]*$'
      reject_context: *rep_ctx
      stopwords: *rep_stop
      min_word_len: 3
      extra: {pesel: null}
      attrs: *rep_attrs
    - type: names
      field: imie_nazwisko      # klucz wyjściowy imienia i nazwiska (jawnie, bez domyślnej nazwy w kodzie)
      nominative: true   # GT ma imiona i nazwiska w mianowniku
      titlecase: true
      pattern:
        - '(?:\badw\.|\br\.\s*pr\.|\bradc\w*\s+prawn\w*|\badwokat\w*|\bapl\.\s*adw\.|\brzecznik\w*\s+patentow\w*)\s*([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)'
        # po czasowniku udzielenia: „ustanawia w osobie Pana Grzegorza Furmana”, „udzielamy Pani Patrycji …”, „ustanawiają swoim pełnomocnikiem Leszka …”
        - '(?:ustanaw\w*|udziel\w*|upoważni\w*)[^.;:]{0,120}?(?:pełnomocnik\w*\s+)?(?:(?:radc\w*\s+prawn\w*|adwokat\w*|adw\.|r\.\s*pr\.|mec\.|aplikant\w*\s+\w+)\s+)?(?:(?:w\s+osobie\s+)?(?:Pan(?:a|u|em)?|Pani(?:ą)?|Panią)\s+)?([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t\n]+(?:[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]{2,})(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)(?![\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ])(?![ \t]+(?:sp\.|S\.A\.|spółk|Sp\.))'
        # współrzędnie po pierwszym pełnomocniku: „… oraz [radcę prawnego] [Panią] Monikę Jaworską”
        - '(?:ustanaw\w*|udziel\w*|upoważni\w*)[^.;]{0,200}?\boraz\s+(?:(?:radc\w*\s+prawn\w*|adwokat\w*|adw\.|r\.\s*pr\.|mec\.|aplikant\w*\s+\w+)\s+)?(?:(?:w\s+osobie\s+)?(?:Pan(?:a|u|em)?|Pani(?:ą)?|Panią)\s+)?([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t\n]+(?:[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]{2,})(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)(?![\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ])(?![ \t]+(?:sp\.|S\.A\.|spółk|Sp\.))'
        # tytuł zawodowy jako kotwica (bez czasownika): „radcy prawnemu Panu X Y”, „mec. X Y”, „adw. X Y”
        - '(?:\badw\.|\br\.\s*pr\.|\bradc\w*\s+prawn\w*|\badwokat\w*|\bapl\.\s*adw\.|\bmec\.|\bmecenas\w*|\brzecznik\w*\s+patentow\w*)\s*(?:(?:w\s+osobie\s+)?(?:Pan(?:a|u|em)?|Pani(?:ą)?|Panią|Mr\.?|Ms\.?|Mrs\.?)\s+)?([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t\n]+(?:[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]{2,})(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)(?![\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ])(?![ \t]+(?:sp\.|S\.A\.|spółk|Sp\.))'
        # EN: „appoint(s) [Mr/Ms] X Y”, „X Y, attorney-at-law / legal adviser”, lista po „hereby appoint(s):”
        - 'appoint\w*\s*:?\s*(?:(?:w\s+osobie\s+)?(?:Pan(?:a|u|em)?|Pani(?:ą)?|Panią|Mr\.?|Ms\.?|Mrs\.?)\s+)?([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t\n]+(?:[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]{2,})(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)(?![\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ])(?![ \t]+(?:sp\.|S\.A\.|spółk|Sp\.))'
        - '([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t\n]+(?:[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]{2,})(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)(?![\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ])(?![ \t]+(?:sp\.|S\.A\.|spółk|Sp\.))\s*,\s*(?:(?:attorney[- ]at[- ]law|advocate|legal\s+(?:adviser|advisor|counsel)|barrister|solicitor|counsel)|radc\w*\s+prawn\w*|adwokat\w*)'
        - '^[ \t]*\d{1,2}[.)][ \t]+(?:(?:w\s+osobie\s+)?(?:Pan(?:a|u|em)?|Pani(?:ą)?|Panią|Mr\.?|Ms\.?|Mrs\.?)\s+)?([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t\n]+(?:[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]{2,})(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)(?![\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ])(?![ \t]+(?:sp\.|S\.A\.|spółk|Sp\.))\s*,\s*(?:(?:attorney[- ]at[- ]law|advocate|legal\s+(?:adviser|advisor|counsel)|barrister|solicitor|counsel)|radc|adwokat|adw\.|r\.\s*pr\.)'
        # tytuły angielskie: attorney-at-law / advocate / legal adviser X Y
        - '(?:attorney[- ]at[- ]law|advocate|legal\s+(?:adviser|advisor|counsel)|barrister|solicitor|counsel)\s+(?:Mr\.?\s+|Ms\.?\s+|Mrs\.?\s+)?([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)'
        # bez tytułu zawodowego: "udziela pełnomocnictwa: Jan Kowalski"
        - '(?:udziel\w*|ustanawia\w*)\s+(?:niniejszym\s+)?pełnomocni\w+\s*:?\s*(?:Pan\w*\s+)?([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)'
        # wiersz tabeli pełnomocników: "1 Jan Kowalski adwokat — 12345678901"
        - '^[ \t]*\d{1,2}\.?[ \t]+([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)[ \t]+(?:adw|r\.\s*pr|radc|apl|rzecz|—|–|-|brak)'
        # punktor z nazwiskiem na początku: "• Jan Kowalski – r. pr."
        - '^[ \t]*[•▪◦*][ \t]+([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)[ \t]*(?:–|-|,|\(|$)'
      stopwords: *rep_stop
      reject_context: *rep_ctx
      extra: {pesel: null}
      attrs: {pesel: '\A(?:(?!\boraz\b|\bi\b|[;•]|\n[ \t]*(?:[–•\-]|\d+[ \t]))[\s\S])*?(?:PESEL\W{0,3}|[ \t—–-])(\d{11})(?!\d)'}

lists:
  mocodawca:
    section: mocodawcy
    # Konsorcjum: "1) Firma A ...; 2) Firma B ...", "1. Firma A" w osobnych liniach, nagłówki
    # "LIDER KONSORCJUM" / "PARTNER KONSORCJUM" albo "MOCODAWCA 1" / "MOCODAWCA 2".
    split: '(?:^|[\s:;])\d\)\s+(?=[A-ZĄĆĘŁŃÓŚŹŻ])|^[ \t]*\d\.[ \t]+(?=[A-ZĄĆĘŁŃÓŚŹŻ„])|(?-i:^[ \t]*(?:LIDER|PARTNER|CZŁONEK|UCZESTNIK)[ \t]+KONSORCJUM\b[^\n]*\n)|^[ \t]*Mocodawca[ \t]+\d+\b[^\n]*\n'
    fields:
      data.nazwa:
        # Formularz: "Firma (nazwa) X" / "Nazwa / firma X".
        - {type: pattern, pattern: '^[ \t]*(?:Firma[ \t]*\(nazwa\)|Nazwa[ \t]*/[ \t]*firma|Nazwa[ \t]+Mocodawcy|Firma)[ \t:]+([^\n]+?)[ \t]*$', clean: true, reject: ['^\(', 'nie\s+dotyczy']}
        - {type: pattern, pattern: 'pod\s+firmą\s+([\s\S]+?),\s*(?:ul\.|al\.|pl\.|os\.|z\s+miejscem|z\s+siedzibą|NIP\b|\d{2}-\d{3})', clean: true}
        # Nazwa w cudzysłowie + forma prawna, w jednej linii (cudzysłów otwierający należy do nazwy).
        - {type: pattern, pattern: '(?-i:(?<![\w])(„[^”\n]+”(?:[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)*[ \t]+(?:S\.A\.|sp\.\s*z\s*o\.\s*o\.(?:\s*sp\.\s*k\.)?|sp\.\s*k\.|sp\.\s*j\.|sp\.\s*p\.|s\.c\.|Sp\.\s*z\s*o\.\s*o\.|Spółka\s+[\w ]+?(?=,|\n|\s\(|\s+z\s+siedzibą)|spółka\s+(?:akcyjna|jawna|komandytowa|partnerska|z\s+ograniczoną\s+odpowiedzialnością))))'}
        # Pierwsza nazwa firmy: wyrazy z wielkiej litery / wersalikami (dopuszczalne łączniki i/w/z) + forma prawna.
        - type: pattern
          clean: true
          reject: ['Kancelari']   # nagłówek kancelarii pełnomocnika to nie mocodawca
          pattern: '(?-i:(?<![\w])((?:(?!Mocodaw|Działając|Pełnomoc|Dane\b|Zamawiaj|Wykonawc|Konsorcj|Ja\b)[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż][\w\-.&]*|[A-ZĄĆĘŁŃÓŚŹŻ0-9][\w]*-[\w\-]+|[A-ZĄĆĘŁŃÓŚŹŻ]{2,}(?=[ \t])|„[^”]+”)(?:[ \t\n]+(?:(?!Mocodaw|Działając|Pełnomoc|Dane\b|Zamawiaj|Wykonawc|Konsorcj|Ja\b)[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż][\w\-.&]*|[A-ZĄĆĘŁŃÓŚŹŻ0-9][\w]*-[\w\-]+|[A-ZĄĆĘŁŃÓŚŹŻ]{2,}(?=[ \t])|„[^”]+”|i|w|z|oraz|im\.))*?[ \t\n]+(?:S\.A\.|sp\.\s*z\s*o\.\s*o\.(?:\s*sp\.\s*k\.)?|sp\.\s*k\.|sp\.\s*j\.|sp\.\s*p\.|s\.c\.|Sp\.\s*z\s*o\.\s*o\.|Spółka\s+[\w ]+?(?=,|\n|\s\(|\s+z\s+siedzibą)|spółka\s+(?:akcyjna|jawna|komandytowa|partnerska|z\s+ograniczoną\s+odpowiedzialnością))))'
        # Przedsiębiorca bez formy prawnej: pierwsza linia pozycji "MARKA-BUD Jan Kowalski".
        - {type: pattern, pattern: '(?-i:^[ \t]*(?:Lider\s+konsorcjum\s*[–-]\s*)?((?:[A-ZĄĆĘŁŃÓŚŹŻ0-9]+-)*[A-ZĄĆĘŁŃÓŚŹŻ0-9]{2,}(?:-[A-ZĄĆĘŁŃÓŚŹŻ0-9]+)*[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?))(?=[ \t]*(?:,|\n))'}
        # Przedsiębiorca: "Jan Kowalski Usługi Remontowo-Budowlane" (imię i nazwisko + określenie działalności).
        - {type: pattern, pattern: '(?-i:^[ \t]*([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+(?:Usługi|Firma|Przedsiębiorstwo|Zakład|Handel|Transport|Usługowo|Handlowo|Produkcja|Biuro|Pracownia)\b[^\n,;]*?))[ \t]*$'}
        - {type: pattern, pattern: 'Mocodawc\w*[ \t]+(?:jest[ \t]+)?(?!ustanaw|upoważ|udziel)([A-ZĄĆĘŁŃÓŚŹŻ0-9„"][^\n,(]+?)(?=,|\n|\s+\()', clean: true, reject: ['^(?-i:[A-ZĄĆĘŁŃÓŚŹŻ \t]+)$', 'pełnomoc']}
      data.krs: {type: pattern, pattern: 'KRS\W{0,3}(?:pod\s+(?:nr|numerem)\W{0,3})?(\d(?:[  ]?\d){9})(?!\d)', digits: true}
      data.nip: {type: pattern, pattern: 'NIP\W{0,3}(?:PL\s?-?)?(\d(?:[  -]?\d){9})(?!\d)', digits: true}
      # Osoba fizyczna: wpis do CEIDG / działalność gospodarcza / zaznaczone pole; inaczej osoba prawna,
      # gdy w pozycji jest forma prawna albo KRS; pozycja bez formy prawnej i bez KRS to przedsiębiorca.
      data.typ:
        - {type: exists, pattern: ['działalnoś\w*\s+gospodarcz', 'CEIDG', 'Ewidencji\s+i\s+Informacji', '\[\s*X\s*\]\s*osoba\s+fizyczn', '[–-][ \t]*(?:Właściciel|Przedsiębiorca)\b'], if_true: osoba_fizyczna, if_false: null}
        - {type: exists, pattern: ['KRS\W{0,3}(?:pod\s+(?:nr|numerem)\W{0,3})?\d', '(?-i:\bS\.\s?A\.|\b[Ss]p\.\s*(?:z\s*o\.|k\.|j\.|p\.)|\bs\.c\.|\b[Ss]półk)'], if_true: osoba_prawna, if_false: osoba_fizyczna}
      data.imie_nazwisko:
        - {type: pattern, pattern: 'niżej\s+podpisan\w*(?:\s*\(a\))?\s+([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)'}
        - {type: pattern, pattern: '^[ \t]*Imię\s+i\s+nazwisko[ \t:]+([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)'}
        - {type: pattern, pattern: '(?-i:([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)[ \t]*[–-][ \t]*(?:Właściciel|Przedsiębiorca)\b)'}
        - {type: pattern, pattern: '(?-i:^[ \t]*(?:Lider\s+konsorcjum\s*[–-]\s*)?(?:[A-ZĄĆĘŁŃÓŚŹŻ0-9]+-)*[A-ZĄĆĘŁŃÓŚŹŻ0-9]{2,}(?:-[A-ZĄĆĘŁŃÓŚŹŻ0-9]+)*[ \t]+([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?))(?=[ \t]*(?:,|\n))'}
      # Podpisujący: nazwiska w bloku podpisów (po pierwszej linii kropek), bez pełnomocników i nazw funkcji.
      podpisujacy:
        type: names
        field: imie_nazwisko      # klucz wyjściowy imienia i nazwiska (jawnie, bez domyślnej nazwy w kodzie)
        nominative: true   # GT ma imiona i nazwiska w mianowniku
        titlecase: true
        scope: document
        # Blok podpisów zaczyna się od pierwszej linii kropek/podkreśleń/kresek lub znacznika podpisu.
        # skany: OCR gubi kropki → także „Za Mocodawcę:”, pieczęć podpisu elektronicznego („Dokument podpisany przez …”)
        after: '\.{8,}|…{2,}|_{5,}|-{8,}|\(podpis\)|/podpis/|/-/|(?-i:^[ \t]*Podpis(?:y\b|[ \t]+Mocodaw|:))|^[ \t]*Za[ \t]+Mocodaw\w*[ \t]*:|Dokument[ \t]+podp\w*|Signature[ \t]+(?:Not[ \t]+)?Verified|Podpisano[ \t]+elektronicznie'
        # Dwa wyrazy z wielkiej litery, ale nie nazwa firmy (po nich forma prawna).
        pattern:
          # nie ulica / patron („ul. Jana Pawła”, OCR „u! Jara Panta”, „im. Jana …”)
          - '(?<![\w-])(?<!ul\.[ \t])(?<!al\.[ \t])(?<!im\.[ \t])(?<!pl\.[ \t])(?<!u![ \t])(?<!ul[ \t])([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)(?![\w-]|[ \t]+(?:S\.\s?A\.|[Ss]p\.|[Ss]półk))'
          # nazwisko WIELKIMI literami: "Ryszard LEWANDOWSKI" (titlecase sprowadza do "Ryszard Lewandowski")
          - '(?<![\w-])([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ]{3,}(?:-[A-ZĄĆĘŁŃÓŚŹŻ]{3,})?)(?![\w-]|[ \t]+(?:S\.\s?A\.|[Ss]p\.|[Ss]półk))'
          # pieczęć e-podpisu, imię często WIELKIMI literami: "Dokument podpisany przez JAN Kowalski" (OCR: "podpinany przeż")
          - '(?i:dokument[ \t]+podp\S*[ \t]+\S+)[ \t]+([A-ZĄĆĘŁŃÓŚŹŻ][A-ZĄĆĘŁŃÓŚŹŻ]+[ \t]+[A-ZĄĆĘŁŃÓŚŹŻ][A-Za-ząćęłńóśźżŁŚŻŹĆŃÓ]+)'
        segment_by: '^\s*(?:W\s+imieniu|Za)\s[^\n]*:\s*$'
        exclude_from: pelnomocnicy
        not_in: data.nazwa     # „Tervana Systemy” z nazwy firmy mocodawcy to nie osoba
        min_word_len: 3        # śmieci OCR („Pawia Il”)
        assign_to_item: true   # kilku mocodawców: podpisy przypisane do bloku / „(firma)” pod podpisem
        company_field: nazwa     # klucz nazwy mocodawcy w pozycji listy (do przypisania podpisów)
        stopwords: [Za, W, Imieniu, Prezes, Wiceprezes, Członek, Zarządu, Prokurent, Dyrektor, Właściciel, Wspólnik, Pełnomocnik, Pełnomocnictwo, Mocodawca, Mocodawcy, Zarząd, Generalny, Finansowy, Komplementariusz, Partner, Kierownik, Imię, Nazwisko, Podpis, Data, Miejsce, Strona, Sp, Spółka, Prezesa, Członka, Upoważniony, Upoważniona, Główny, Księgowy, Handlowy, Przedsiębiorca, Samoistny, Management, Board, President, Member, Principal, Attorney, Przyjęcie, Wykonawca, Wykonawcy, Lider, Konsorcjum, Kancelaria, Radcy, Radca, Prawnego, Prawny, Adwokacka, Adwokat, Dokument, Signature, Verified, Podpisany, Podpisano]

# Walidacja (tylko ostrzeżenia w evidence/, wynik w output/ bez zmian). Dostępne checki: src/odw/validate.py.
validate:
  mocodawca[*].data.nip: [{check: nip}]
  mocodawca[*].data.krs: [{check: krs}]
  mocodawca[*].data.typ: [{check: enum, values: [osoba_prawna, osoba_fizyczna]}]
  pelnomocnicy[*].pesel: [{check: pesel}]
